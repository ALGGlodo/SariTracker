<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARI-TRACKER</title>
    <script src="https://kit.fontawesome.com/56c8bde467.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>SARI-TRACKER</h2>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="#">Stock</a></li>
                <li><a href="#">Reports</a></li>
            </ul>
        </aside>

        <main>
            <section class="products-inventory">
                <div class="products-content">
                    <h2>Products Dashboard</h2>
                    <p>Welcome to the Products section! Track your product inventory here.</p>
                    <div class="product-header">
                        <p>Inventory Filters</p>
                            <div class="filter">
                                <i class="fa-solid fa-filter" aria-hidden="true"></i>
                                <button type="button" id="filter-button">All Categories</button>
                            </div>
                    </div>

                    <form class="add-products"  id="addProductForm">
                        <div class="form-group">
                            <label for="productName">Add Product</label>
                            <input type="text" id="productName" name="productName" placeholder="e.g Pancit Canton" required>
                        </div>

                        <div class="form-group">
                            <label for="productsCategory">Category</label>
                                <select id="productsCategory" name="category" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="Foods">Foods</option>
                                <option value="Beverages">Beverages</option>
                                <option value="Snacks">Snacks</option>
                                <option value="Canned Goods">Canned Goods</option>
                                <option value="Personal Care">Personal Care</option>
                                <option value="Household">Household</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="productPrice">Price</label>
                            <input type="number" id="productPrice" name="price" placeholder="e.g 50.00" min="0" step="0.01" required>
                        </div>

                        <button type="submit" id="addProductButton"> + Add Product</button>
                    </form>

                    <table>
                        <thead>
                           <tr>
                                <th scope="col">Product Name & Category</th>
                                <th scope="col">Price</th>
                                <th scope="col">Quick Actions</th>
                           </tr>
                        </thead>
                        <tbody id="productsTable">

                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/product.js"></script>
</body>
</html>
